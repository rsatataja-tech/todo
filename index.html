<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todos - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Todo App Test</h1>
    <button onclick="testClick()">Test Button - Click Me!</button>
    <button id="jsButton">JS Event Listener Button</button>
    <div id="output">Waiting for clicks...</div>

    <script>
        // Inline script to test
        console.log('Inline script loaded');
        document.getElementById('output').innerHTML = 'JavaScript is working!';
        
        function testClick() {
            alert('Button clicked! JavaScript works!');
            document.getElementById('output').innerHTML = 'Button was clicked at ' + new Date().toLocaleTimeString();
        }
        
        // Test event listener
        document.getElementById('jsButton').addEventListener('click', function() {
            alert('Event listener works!');
        });
    </script>
</body>
</html>
